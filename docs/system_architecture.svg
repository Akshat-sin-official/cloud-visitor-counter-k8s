<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D"/>
      <stop offset="100%" stop-color="#121624"/>
    </linearGradient>
    <linearGradient id="primaryCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151C33"/>
      <stop offset="100%" stop-color="#0D1322"/>
    </linearGradient>
    <linearGradient id="secondaryCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112423"/>
      <stop offset="100%" stop-color="#091717"/>
    </linearGradient>
    <linearGradient id="routerCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241438"/>
      <stop offset="100%" stop-color="#130B21"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Title Header -->
  <text x="600" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">ORBIT CLOUD ARCHITECTURE &amp; HYBRID FAILOVER TOPOLOGY</text>
  <text x="600" y="85" font-family="'JetBrains Mono', monospace" font-size="14" fill="#94A3B8" text-anchor="middle">Flask + Redis Microservice • Kubernetes HPA • Dual-Cluster Simulation</text>

  <!-- External Traffic & Ingress Router -->
  <rect x="425" y="120" width="350" height="130" rx="16" fill="url(#routerCard)" stroke="#8B5CF6" stroke-width="2" filter="url(#glow)"/>
  <text x="600" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#C4B5FD" text-anchor="middle">HYBRID CLOUD TRAFFIC ROUTER</text>
  <text x="600" y="172" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0" text-anchor="middle">Reverse Proxy / Ingress Gateway (:8080)</text>
  <rect x="450" y="190" width="300" height="42" rx="8" fill="#130B21" stroke="#6D28D9" stroke-width="1"/>
  <text x="600" y="215" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A78BFA" text-anchor="middle">Autonomous Health Daemon (2s Probes)</text>

  <!-- Client Traffic Arrow -->
  <line x1="600" y1="95" x2="600" y2="120" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- PRIMARY CLUSTER CONTAINER -->
  <rect x="50" y="300" width="520" height="450" rx="20" fill="url(#primaryCard)" stroke="#3B82F6" stroke-width="2"/>
  <text x="80" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#60A5FA">PRIMARY CLUSTER (Private Cloud Core)</text>
  <text x="80" y="365" font-family="'JetBrains Mono', monospace" font-size="12" fill="#93C5FD">Minikube Profile: orbit-primary | Namespace: orbit-system</text>

  <!-- Primary Ingress Service -->
  <rect x="80" y="390" width="460" height="50" rx="10" fill="#0E1626" stroke="#2563EB" stroke-width="1"/>
  <text x="310" y="420" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#93C5FD" text-anchor="middle">NodePort Service: orbit-visitor-service (:30080)</text>

  <!-- Primary Visitor Pods & HPA -->
  <rect x="80" y="460" width="460" height="150" rx="12" fill="#0A0F1D" stroke="#1E293B" stroke-width="1"/>
  <text x="100" y="488" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Deployment: orbit-visitor-counter (Replicas: 2..8)</text>
  <text x="490" y="488" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" text-anchor="end">HPA: Target 50% CPU</text>

  <!-- Sub-pods inside primary -->
  <rect x="100" y="505" width="205" height="85" rx="8" fill="#172554" stroke="#3B82F6" stroke-width="1"/>
  <text x="202" y="530" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Pod: visitor-1</text>
  <text x="202" y="550" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD" text-anchor="middle">100m CPU / 64Mi RAM</text>
  <text x="202" y="570" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4ADE80" text-anchor="middle">● Ready (Probes OK)</text>

  <rect x="325" y="505" width="205" height="85" rx="8" fill="#172554" stroke="#3B82F6" stroke-width="1"/>
  <text x="427" y="530" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Pod: visitor-2</text>
  <text x="427" y="550" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD" text-anchor="middle">100m CPU / 64Mi RAM</text>
  <text x="427" y="570" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4ADE80" text-anchor="middle">● Ready (Probes OK)</text>

  <!-- Primary Redis -->
  <rect x="80" y="630" width="460" height="95" rx="10" fill="#0E1626" stroke="#DC2626" stroke-width="1"/>
  <text x="100" y="658" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FCA5A5">State Engine: orbit-redis (ClusterIP: 6379)</text>
  <text x="100" y="682" font-family="'JetBrains Mono', monospace" font-size="11" fill="#CBD5E1">Persistent Volume Claim: orbit-redis-pvc (1Gi Storage)</text>
  <text x="100" y="705" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4ADE80">● State Persistent across Pod Evictions</text>

  <!-- SECONDARY CLUSTER CONTAINER -->
  <rect x="630" y="300" width="520" height="450" rx="20" fill="url(#secondaryCard)" stroke="#10B981" stroke-width="2"/>
  <text x="660" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#34D399">SECONDARY CLUSTER (Public Cloud DR)</text>
  <text x="660" y="365" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6EE7B7">Minikube Profile: orbit-secondary | Namespace: orbit-system</text>

  <!-- Secondary Ingress Service -->
  <rect x="660" y="390" width="460" height="50" rx="10" fill="#061F1A" stroke="#059669" stroke-width="1"/>
  <text x="890" y="420" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#6EE7B7" text-anchor="middle">NodePort Service: orbit-visitor-service (:30080)</text>

  <!-- Secondary Visitor Pods -->
  <rect x="660" y="460" width="460" height="150" rx="12" fill="#041411" stroke="#064E3B" stroke-width="1"/>
  <text x="680" y="488" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Deployment: orbit-visitor-counter (DR Hot Standby: 2 Replicas)</text>

  <rect x="680" y="505" width="205" height="85" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="782" y="530" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Pod: sec-visitor-1</text>
  <text x="782" y="550" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A7F3D0" text-anchor="middle">100m CPU / 64Mi RAM</text>
  <text x="782" y="570" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399" text-anchor="middle">● Standby Online</text>

  <rect x="905" y="505" width="205" height="85" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="1007" y="530" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Pod: sec-visitor-2</text>
  <text x="1007" y="550" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A7F3D0" text-anchor="middle">100m CPU / 64Mi RAM</text>
  <text x="1007" y="570" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399" text-anchor="middle">● Standby Online</text>

  <!-- Secondary Redis -->
  <rect x="660" y="630" width="460" height="95" rx="10" fill="#061F1A" stroke="#DC2626" stroke-width="1"/>
  <text x="680" y="658" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FCA5A5">State Engine: orbit-redis (ClusterIP: 6379)</text>
  <text x="680" y="682" font-family="'JetBrains Mono', monospace" font-size="11" fill="#CBD5E1">Persistent Volume Claim: orbit-redis-pvc (1Gi Storage)</text>
  <text x="680" y="705" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399">● Replicated State Engine</text>

  <!-- Dynamic Router Connections -->
  <!-- Primary Route (Active) -->
  <path d="M 510 250 L 510 270 L 310 270 L 310 390" fill="none" stroke="#3B82F6" stroke-width="3"/>
  <circle cx="310" cy="390" r="5" fill="#3B82F6"/>
  <text x="350" y="285" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#60A5FA">ACTIVE PRIMARY ROUTE (100%)</text>

  <!-- Secondary Route (Failover) -->
  <path d="M 690 250 L 690 270 L 890 270 L 890 390" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="890" cy="390" r="5" fill="#10B981"/>
  <text x="730" y="285" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34D399">FAILOVER DR ROUTE (STANDBY)</text>
</svg>
