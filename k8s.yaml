# ==============================================================================
# ORBIT Platform — Consolidated Kubernetes Deployment Manifest (k8s.yaml)
# Defines: Namespace, PVC, Redis Deployment, Redis Service, ConfigMap, Secret,
#          Visitor Counter Deployment (2 Replicas, Probes, Resources), NodePort Service
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: orbit-system
  labels:
    app.kubernetes.io/name: orbit
    app.kubernetes.io/part-of: orbit-platform
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orbit-redis-pvc
  namespace: orbit-system
  labels:
    app: orbit-redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-redis
  namespace: orbit-system
  labels:
    app: orbit-redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbit-redis
  template:
    metadata:
      labels:
        app: orbit-redis
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: redis-storage
              mountPath: /data
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: orbit-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-redis
  namespace: orbit-system
  labels:
    app: orbit-redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: orbit-redis
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orbit-visitor-config
  namespace: orbit-system
  labels:
    app: orbit-visitor-counter
data:
  REDIS_HOST: "orbit-redis"
  REDIS_PORT: "6379"
  PORT: "5001"
  CLUSTER_NAME: "ORBIT-PRIMARY"
  ENVIRONMENT: "production"
  VISITOR_KEY: "orbit:visitor_count"
  FLASK_DEBUG: "0"
---
apiVersion: v1
kind: Secret
metadata:
  name: orbit-visitor-secrets
  namespace: orbit-system
  labels:
    app: orbit-visitor-counter
type: Opaque
stringData:
  REDIS_PASSWORD: ""
  API_SIGNING_KEY: "orbit-cloud-academic-secret-key-2026"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-visitor-counter
  namespace: orbit-system
  labels:
    app: orbit-visitor-counter
    app.kubernetes.io/component: telemetry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbit-visitor-counter
  template:
    metadata:
      labels:
        app: orbit-visitor-counter
        app.kubernetes.io/component: telemetry
    spec:
      containers:
        - name: visitor-counter
          image: orbit-visitor-counter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              name: http
          envFrom:
            - configMapRef:
                name: orbit-visitor-config
            - secretRef:
                name: orbit-visitor-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-visitor-service
  namespace: orbit-system
  labels:
    app: orbit-visitor-counter
spec:
  type: NodePort
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30080
      name: http
  selector:
    app: orbit-visitor-counter
