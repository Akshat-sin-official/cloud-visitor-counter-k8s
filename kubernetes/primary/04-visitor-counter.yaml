apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-visitor-counter
  namespace: orbit-system
  labels:
    app: orbit-visitor-counter
    app.kubernetes.io/component: telemetry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbit-visitor-counter
  template:
    metadata:
      labels:
        app: orbit-visitor-counter
        app.kubernetes.io/component: telemetry
    spec:
      containers:
        - name: visitor-counter
          image: orbit-visitor-counter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              name: http
          envFrom:
            - configMapRef:
                name: orbit-visitor-config
            - secretRef:
                name: orbit-visitor-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-visitor-service
  namespace: orbit-system
  labels:
    app: orbit-visitor-counter
spec:
  type: NodePort
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30080
      name: http
  selector:
    app: orbit-visitor-counter
